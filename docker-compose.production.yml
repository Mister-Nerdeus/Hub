services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data

  api:
    image: ${API_IMAGE:-hub-api-production}
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hub:hub@db:5432/hub}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hub.nerdeus.com}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: ${API_IMAGE:-hub-api-production}
    profiles:
      - tools
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    command: alembic -c /app/alembic.ini upgrade head
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hub:hub@db:5432/hub}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-hub-web-production}
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-80}:80"

volumes:
  hub-postgres-data:
