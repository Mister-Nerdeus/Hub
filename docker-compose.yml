services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.local
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hub:hub@db:5432/hub}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://localhost:5173,http://localhost:5174}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8010}:8000"

  migrate:
    profiles:
      - tools
    build:
      context: .
      dockerfile: apps/api/Dockerfile.local
    command: alembic upgrade head
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hub:hub@db:5432/hub}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.local
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
      VITE_BUILD_COMMIT: ${VITE_BUILD_COMMIT:-local-dev}
      VITE_BUILD_TIME: ${VITE_BUILD_TIME:-local-dev}
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-5180}:5173"

volumes:
  hub-postgres-data:
