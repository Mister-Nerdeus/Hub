name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    name: Node workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-no-phi-fields.mjs
      - run: node scripts/check-docs-contracts.mjs
      - run: npm --workspace packages/shared test
      - run: npm --workspace apps/web run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest
        working-directory: apps/api

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
